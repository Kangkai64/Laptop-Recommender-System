{% extends "base.html" %}

{% block title %}Server Error - Laptop Recommender System{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-6 text-center">
            <div class="mb-4">
                <i class="fas fa-server" style="font-size: 6rem; color: #e74c3c;"></i>
            </div>
            
            <h1 class="display-1 fw-bold text-muted">500</h1>
            <h2 class="mb-4">Server Error</h2>
            
            <p class="lead text-muted mb-5">
                Something went wrong on our end. We're working to fix the issue. 
                Please try again in a few moments.
            </p>
            
            <div class="d-grid gap-3 d-md-block">
                <a href="{{ url_for('index') }}" class="btn btn-primary btn-lg">
                    <i class="fas fa-home me-2"></i>Go Home
                </a>
                <button onclick="location.reload()" class="btn btn-outline-primary btn-lg">
                    <i class="fas fa-redo me-2"></i>Try Again
                </button>
            </div>
        </div>
    </div>
</div>
{% endblock %}
