{% extends "base.html" %}

{% block title %}Page Not Found - Laptop Recommender System{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-6 text-center">
            <div class="mb-4">
                <i class="fas fa-exclamation-triangle" style="font-size: 6rem; color: #f39c12;"></i>
            </div>
            
            <h1 class="display-1 fw-bold text-muted">404</h1>
            <h2 class="mb-4">Page Not Found</h2>
            
            <p class="lead text-muted mb-5">
                Oops! The page you're looking for doesn't exist. 
                It might have been moved, deleted, or you entered the wrong URL.
            </p>
            
            <div class="d-grid gap-3 d-md-block">
                <a href="{{ url_for('index') }}" class="btn btn-primary btn-lg">
                    <i class="fas fa-home me-2"></i>Go Home
                </a>
                <a href="{{ url_for('explore') }}" class="btn btn-outline-primary btn-lg">
                    <i class="fas fa-compass me-2"></i>Explore Laptops
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
